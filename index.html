document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

4\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"033b38d4-bacb-4912-a231-0efb5f6d8393\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n<!-- Theme boot (prevents FOUC) -->\n<script>\n  (function () {\n    try {\n      var stored = localStorage.getItem('theme');\n      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;\n      var isDark = stored === 'dark' || (!stored && prefersDark);\n      document.documentElement.classList.add(isDark ? 'dark' : 'light');\n    } catch (e) {}\n  })();\n<\u002Fscript>\n\n<style>\n  /* ── Light mode tokens ── */\n  :root {\n    --text:        #1a1a1a;\n    --muted:       #6b6b6b;\n    --green:       #046A38;\n    --green-dark:  #024F29;\n    --green-soft:  #f2f7f4;\n    --warm:        #B4654A;\n    --warm-dark:   #8E4E38;\n    --warm-soft:   #faf3f0;\n    --bg:          #fdfdfc;\n    --rule:        #e8e8e4;\n    --pub-accent:  #d4e9dc;\n    --pub-hover:   #f7f9f7;\n  }\n\n  /* ── Dark mode tokens (system preference) ── */\n  @media (prefers-color-scheme: dark) {\n    :root:not(.light) {\n      --text:       #d4d1c8;\n      --muted:      #918e85;\n      --green:      #4aab6e;\n      --green-dark: #5cc484;\n      --green-soft: #111a14;\n      --warm:       #D4845F;\n      --warm-dark:  #E09A7A;\n      --warm-soft:  #1e1614;\n      --bg:         #1c1b18;\n      --rule:       #2e2d28;\n      --pub-accent: #1a2820;\n      --pub-hover:  #23221e;\n    }\n  }\n\n  /* ── Dark mode (manual toggle) ── */\n  :root.dark {\n    --text:       #d4d1c8;\n    --muted:      #918e85;\n    --green:      #4aab6e;\n    --green-dark: #5cc484;\n    --green-soft: #111a14;\n    --warm:       #D4845F;\n    --warm-dark:  #E09A7A;\n    --warm-soft:  #1e1614;\n    --bg:         #1c1b18;\n    --rule:       #2e2d28;\n    --pub-accent: #1a2820;\n    --pub-hover:  #23221e;\n  }\n\n  /* ── Light mode (manual override) ── */\n  :root.light {\n    --text:       #1a1a1a;\n    --muted:      #6b6b6b;\n    --green:      #046A38;\n    --green-dark: #024F29;\n    --green-soft: #f2f7f4;\n    --warm:       #B4654A;\n    --warm-dark:  #8E4E38;\n    --warm-soft:  #faf3f0;\n    --bg:         #fdfdfc;\n    --rule:       #e8e8e4;\n    --pub-accent: #d4e9dc;\n    --pub-hover:  #f7f9f7;\n  }\n\n  /* ── Theme toggle button ── */\n  #theme-toggle {\n    margin-left: auto;\n    background: none;\n    border: none;\n    cursor: pointer;\n    color: var(--muted);\n    padding: 0;\n    line-height: 1;\n    transition: color 0.15s ease;\n    display: flex;\n    align-items: center;\n  }\n  #theme-toggle:hover { color: var(--green); }\n  #theme-toggle svg { width: 15px; height: 15px; }\n\n  * { box-sizing: border-box; }\n  html { scroll-behavior: smooth; }\n\n  /* ── Skip link ── */\n  .skip-link {\n    position: absolute;\n    top: -100px;\n    left: 1rem;\n    background: var(--green);\n    color: #fff;\n    padding: 0.5rem 1rem;\n    border-radius: 0 0 6px 6px;\n    font-size: 0.85rem;\n    font-weight: 600;\n    text-decoration: none;\n    border-bottom: none;\n    z-index: 100;\n    transition: top 0.15s ease;\n  }\n  .skip-link:focus { top: 0; }\n\n  body {\n    font-family: \"Atkinson Hyperlegible Next\", -apple-system, system-ui, sans-serif;\n    max-width: 780px;\n    margin: 0 auto;\n    padding: 3rem 1.5rem 5rem;\n    color: var(--text);\n    background: var(--bg);\n    line-height: 1.7;\n    font-size: 17px;\n    -webkit-font-smoothing: antialiased;\n  }\n\n  /* ── Top accent bar: two-tone green/warm ── */\n  body::before {\n    content: \"\";\n    position: fixed;\n    top: 0; left: 0; right: 0;\n    height: 3px;\n    background: linear-gradient(90deg, var(--green) 70%, var(--warm) 100%);\n    z-index: 10;\n  }\n\n  /* ── Nav ── */\n  nav {\n    font-size: 0.82rem;\n    letter-spacing: 0.02em;\n    text-transform: uppercase;\n    border-bottom: 1px solid var(--rule);\n    padding-bottom: 1rem;\n    margin-bottom: 2.5rem;\n    display: flex;\n    align-items: center;\n  }\n  nav a {\n    margin-right: 1.5rem;\n    color: var(--muted);\n    text-decoration: none;\n    border-bottom: none;\n    transition: color 0.15s ease;\n    position: relative;\n  }\n  nav a:hover,\n  nav a.active { color: var(--green); }\n  nav a.active::after {\n    content: \"\";\n    position: absolute;\n    left: 0; right: 0;\n    bottom: -1.05rem;\n    height: 2px;\n    background: var(--green);\n  }\n\n  /* ── Header ── */\n  header {\n    display: flex;\n    align-items: center;\n    gap: 1.75rem;\n    margin-bottom: 2.5rem;\n    flex-wrap: wrap;\n  }\n  .photo-wrap {\n    position: relative;\n    width: 140px;\n    height: 140px;\n    flex-shrink: 0;\n  }\n  .photo-wrap::before {\n    content: \"\";\n    position: absolute;\n    inset: 10px -10px -10px 10px;\n    background: var(--warm-soft);\n    z-index: 0;\n  }\n  header img {\n    position: relative;\n    z-index: 1;\n    width: 140px;\n    height: 140px;\n    border-radius: 2px;\n    object-fit: cover;\n    border: 1px solid var(--rule);\n    display: block;\n  }\n\n  /* ── Type scale ── */\n  h1 {\n    font-family: \"Instrument Serif\", Georgia, serif;\n    font-size: clamp(2.4rem, 5.5vw, 3.3rem);\n    margin: 0 0 0.35rem;\n    font-weight: 400;\n    letter-spacing: -0.015em;\n    line-height: 1.02;\n  }\n  .title {\n    color: var(--muted);\n    margin: 0;\n    font-size: 0.95rem;\n  }\n  h2 {\n    font-family: \"Instrument Serif\", Georgia, serif;\n    font-size: clamp(1.7rem, 3vw, 2rem);\n    margin-top: 3.2rem;\n    margin-bottom: 0.8rem;\n    font-weight: 400;\n    letter-spacing: -0.01em;\n    line-height: 1.15;\n    position: relative;\n    padding-bottom: 0.5rem;\n    scroll-margin-top: 1.5rem;\n  }\n  h2::after {\n    content: \"\";\n    position: absolute;\n    left: 0; bottom: 0;\n    width: 40px;\n    height: 2px;\n    background: var(--warm);\n  }\n  h3 {\n    font-size: 0.82rem;\n    margin-top: 2rem;\n    margin-bottom: 0.75rem;\n    color: var(--green);\n    text-transform: uppercase;\n    letter-spacing: 0.09em;\n    font-weight: 600;\n  }\n\n  /* ── Links ── */\n  a {\n    color: var(--green);\n    text-decoration: none;\n    border-bottom: 1px solid transparent;\n    transition: border-color 0.15s ease, color 0.15s ease;\n  }\n  a:hover { border-bottom-color: var(--green); }\n\n  p { margin: 0 0 1rem; }\n\n  /* ── Publication entries ── */\n  .pub {\n    padding: 0.85rem 0.85rem;\n    margin-left: -0.85rem;\n    margin-right: -0.85rem;\n    border-left: 3px solid transparent;\n    border-radius: 2px;\n    transition: background 0.15s ease, border-color 0.15s ease;\n  }\n  .pub + .pub {\n    border-top: 1px solid var(--rule);\n  }\n  h3 + .pub { padding-top: 0.85rem; }\n\n  .pub:hover {\n    background: var(--pub-hover);\n    border-left-color: var(--pub-accent);\n  }\n\n  /* publication title links: slightly heavier */\n  .pub > a.pub-title {\n    font-weight: 500;\n  }\n\n  .pub .venue { color: var(--muted); font-style: italic; }\n  .pub .media {\n    font-size: 0.88rem;\n    color: var(--muted);\n    margin-top: 0.3rem;\n  }\n  .pub .media a {\n    color: var(--warm);\n    border-bottom-color: transparent;\n  }\n  .pub .media a:hover {\n    color: var(--warm-dark);\n    border-bottom-color: var(--warm);\n  }\n\n  /* ── Contact list ── */\n  .contact-list {\n    list-style: none;\n    padding: 0;\n    margin: 0;\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 0.5rem 2rem;\n  }\n  @media (max-width: 520px) {\n    .contact-list { grid-template-columns: 1fr; }\n  }\n  .contact-list li {\n    display: flex;\n    align-items: flex-start;\n    gap: 0.65rem;\n    color: var(--text);\n    padding: 0.4rem 0;\n  }\n  .contact-list .icon {\n    flex-shrink: 0;\n    width: 17px;\n    height: 17px;\n    margin-top: 4px;\n    color: var(--warm);\n  }\n\n  /* ── Misc ── */\n  ul { padding-left: 1.1rem; }\n  ul li { margin-bottom: 0.35rem; }\n  .note { font-size: 0.82rem; color: var(--muted); margin-top: 1rem; }\n\n  footer {\n    margin-top: 4rem;\n    font-size: 0.82rem;\n    color: var(--muted);\n    border-top: 1px solid var(--rule);\n    padding-top: 1.2rem;\n  }\n\n  /* ── Section dividers: subtle breathing room ── */\n  h2#teaching { margin-top: 3.8rem; }\n  h2#contact  { margin-top: 3.8rem; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- Skip link -->\n<a href=\"#main-content\" class=\"skip-link\">Skip to content<\u002Fa>\n\n<nav aria-label=\"Main navigation\">\n  <a href=\"#about\" data-section=\"about\">Home<\u002Fa>\n  <a href=\"cv.pdf\">CV<\u002Fa>\n  <a href=\"#research\" data-section=\"research\">Research<\u002Fa>\n  <a href=\"#teaching\" data-section=\"teaching\">Teaching<\u002Fa>\n  <a href=\"#contact\" data-section=\"contact\">Contact<\u002Fa>\n  <button id=\"theme-toggle\" aria-label=\"Toggle dark mode\" title=\"Toggle dark mode\">\n    <!-- sun icon (shown in dark mode) -->\n    <svg id=\"icon-sun\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"display:none\">\n      <circle cx=\"12\" cy=\"12\" r=\"5\"><\u002Fcircle><line x1=\"12\" y1=\"1\" x2=\"12\" y2=\"3\"><\u002Fline><line x1=\"12\" y1=\"21\" x2=\"12\" y2=\"23\"><\u002Fline><line x1=\"4.22\" y1=\"4.22\" x2=\"5.64\" y2=\"5.64\"><\u002Fline><line x1=\"18.36\" y1=\"18.36\" x2=\"19.78\" y2=\"19.78\"><\u002Fline><line x1=\"1\" y1=\"12\" x2=\"3\" y2=\"12\"><\u002Fline><line x1=\"21\" y1=\"12\" x2=\"23\" y2=\"12\"><\u002Fline><line x1=\"4.22\" y1=\"19.78\" x2=\"5.64\" y2=\"18.36\"><\u002Fline><line x1=\"18.36\" y1=\"5.64\" x2=\"19.78\" y2=\"4.22\"><\u002Fline>\n    <\u002Fsvg>\n    <!-- moon icon (shown in light mode) -->\n    <svg id=\"icon-moon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z\"><\u002Fpath>\n    <\u002Fsvg>\n  <\u002Fbutton>\n<\u002Fnav>\n\n<main id=\"main-content\">\n\n\n\n<header id=\"about\">\n  <div class=\"photo-wrap\">\n    <img src=\"f591e506-35b1-40e5-9fc1-34da0585f526\" alt=\"Peter Nencka\" width=\"140\" height=\"140\" loading=\"eager\">\n  <\u002Fdiv>\n  <div>\n    <h1>Peter Nencka<\u002Fh1>\n    <p class=\"title\">Rose-Marie Garcia Anderson Assistant Professor of Economics<br>Miami University<\u002Fp>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<p>\n  Welcome! I am the Rose-Marie Garcia Anderson Assistant Professor in the\n  <a href=\"https://miamioh.edu/fsb/academics/economics/index.html\">Economics Department<\u002Fa>\n  at <a href=\"https://www.miamioh.edu/\">Miami University<\u002Fa> and a Faculty Research Fellow at the\n  <a href=\"https://www.nber.org/programs-projects/programs-working-groups/development-american-economy\">National Bureau of Economic Research<\u002Fa>.\n<\u002Fp>\n\n<p>\n  My research focuses on labor and public economics, with applications to economic history, education, and innovation.\n  Before graduate school, I studied economics and philosophy at <a href=\"https://www.beloit.edu/\">Beloit College<\u002Fa>.\n<\u002Fp>\n\n<p>\n  You can find my CV <a href=\"cv.pdf\">here<\u002Fa>, and reach me by email at\n  <a href=\"mailto:nenckap@miamioh.edu\">nenckap@miamioh.edu<\u002Fa>.\n<\u002Fp>\n\n<h2 id=\"research\">Research<\u002Fh2>\n\n<h3>Publications<\u002Fh3>\n\n<div class=\"pub\">\n  <a href=\"assets/carnegie.pdf\" class=\"pub-title\">Knowledge access: The effects of Carnegie libraries on innovation<\u002Fa>\n  (with <a href=\"https://sites.google.com/view/enricoberkes/home\">Enrico Berkes<\u002Fa>).\n  <span class=\"venue\">Forthcoming at The Review of Economics and Statistics.<\u002Fspan>\n<\u002Fdiv>\n\n<div class=\"pub\">\n  <a href=\"assets/returns_library.pdf\" class=\"pub-title\">The returns to public library investment<\u002Fa>\n  (with <a href=\"https://www.montana.edu/gilpin/\">Greg Gilpin<\u002Fa> and <a href=\"https://ezrakarger.com/\">Ezra Karger<\u002Fa>).\n  <span class=\"venue\">American Economic Journal: Economic Policy 16 (2024): 78–109.<\u002Fspan>\n  <div class=\"media\">\n    Media: <a href=\"https://www.marketplace.org/2021/07/20/public-libraries-investment-well-worth-it/\">Marketplace<\u002Fa>,\n    <a href=\"https://www.marketwatch.com/story/how-do-you-quantify-the-value-of-a-public-library-heres-what-one-report-finds-11622226258\">MarketWatch<\u002Fa>,\n    <a href=\"https://fordhaminstitute.org/national/commentary/can-investments-public-libraries-boost-educational-outcomes\">Fordham Institute<\u002Fa>.\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"pub\">\n  <a href=\"assets/school_closures.pdf\" class=\"pub-title\">School closures during the 1918 flu pandemic<\u002Fa>\n  (with <a href=\"https://www.philippager.com/\">Philipp Ager<\u002Fa>,\n  <a href=\"http://kaeriksson.ucdavis.edu/\">Katherine Eriksson<\u002Fa>,\n  <a href=\"https://ezrakarger.com/\">Ezra Karger<\u002Fa>, and\n  <a href=\"https://miamioh.edu/fsb/directory/?up=%2Fdirectory%2Fthomasma\">Melissa A. Thomasson<\u002Fa>;\n  also <a href=\"https://www.nber.org/papers/w28246\">NBER WP w28246<\u002Fa>).\n  <span class=\"venue\">The Review of Economics and Statistics 106 (2024): 266–276.<\u002Fspan>\n<\u002Fdiv>\n\n<div class=\"pub\">\n  <a href=\"assets/census_place_project.pdf\" class=\"pub-title\">The Census Place Project: A method for geolocating unstructured place names<\u002Fa>\n  (with <a href=\"https://sites.google.com/view/enricoberkes/home\">Enrico Berkes<\u002Fa> and\n  <a href=\"https://ezrakarger.com/\">Ezra Karger<\u002Fa>).\n  <span class=\"venue\">Explorations in Economic History, Vol. 87 (January 2023).<\u002Fspan>\n  <div class=\"media\">\n    <a href=\"https://www.openicpsr.org/openicpsr/project/179401/version/V1/view\">Crosswalks<\u002Fa> ·\n    <a href=\"https://github.com/ezrakarger/census_place_project\">Code<\u002Fa>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"pub\">\n  <a href=\"https://www.sciencedirect.com/science/article/pii/S1041608019300214\" class=\"pub-title\">Predicting education attainment: Does grit compensate for low levels of cognitive ability?<\u002Fa>\n  (with <a href=\"https://economics.osu.edu/people/light.20\">Audrey Light<\u002Fa>).\n  <span class=\"venue\">Learning and Individual Differences, 2019.<\u002Fspan>\n<\u002Fdiv>\n\n<h3>Works in Progress<\u002Fh3>\n\n<div class=\"pub\">\n  <a href=\"assets/high_schools.pdf\" class=\"pub-title\">High schools and the uneven rise in American opportunity<\u002Fa>\n  (with <a href=\"https://ezrakarger.com/\">Ezra Karger<\u002Fa> and Alison Doxey Koetting).\n<\u002Fdiv>\n\n<div class=\"pub\">\n  <a href=\"assets/pandemic_hospitals.pdf\" class=\"pub-title\">Do pandemics change healthcare? Evidence from the Great Influenza<\u002Fa>\n  (with <a href=\"https://sites.google.com/view/resteves\">Rui Esteves<\u002Fa>,\n  <a href=\"https://sites.google.com/site/krismitchener/home\">Kris James Mitchener<\u002Fa>, and\n  <a href=\"https://miamioh.edu/fsb/directory/?up=%2Fdirectory%2Fthomasma\">Melissa A. Thomasson<\u002Fa>;\n  also <a href=\"https://www.nber.org/papers/w30643\">NBER WP w30643<\u002Fa>).\n<\u002Fdiv>\n\n<div class=\"pub\">\n  Out of the university, into the workforce: Early 20th century scientific training and industrial research\n  (with <a href=\"https://www.xuechaoqian.com/home\">Xuechao Qian<\u002Fa>).\n<\u002Fdiv>\n\n<div class=\"pub\">\n  The Women's Ku Klux Klan and education in the 1920s\n  (with <a href=\"https://daniellecgw.github.io/research\">Danielle Graves Williamson<\u002Fa>).\n<\u002Fdiv>\n\n<div class=\"pub\">\n  <a href=\"assets/soccer_record.pdf\" class=\"pub-title\">Soccer's record on the road: The effect of late-night sporting events on fatal car crashes<\u002Fa>\n  (with <a href=\"https://sites.google.com/colorado.edu/james-flynn\">James Flynn<\u002Fa> and Noah Meyers-Richter*).\n<\u002Fdiv>\n\n<h3>Book Chapters<\u002Fh3>\n\n<div class=\"pub\">\n  \"Credit Constraints Throughout Childhood and Education Attainment,\"\n  in <em>Annual Proceedings of The Wealth and Well-Being of Nations; The Miller Upton Forum, Volume XII<\u002Fem>,\n  Beloit College Press, 2021.\n<\u002Fdiv>\n\n<p class=\"note\">*Former Miami University student<\u002Fp>\n\n<h2 id=\"teaching\">Teaching<\u002Fh2>\n\n<h3>Current Courses<\u002Fh3>\n\n<div class=\"pub\">\n  <strong>Examining Economic Data and Models<\u002Fstrong> (undergraduate econometrics) — Miami University, Fall 2020–present\n<\u002Fdiv>\n<div class=\"pub\">\n  <strong>Graduate Applied Microeconomics<\u002Fstrong> (advanced causal inference and machine learning) — Miami University, Spring 2023–present\n<\u002Fdiv>\n\n<h3>Past Courses<\u002Fh3>\n\n<div class=\"pub\">\n  <strong>Introduction to Microeconomics<\u002Fstrong> — Miami University, Fall 2024\n<\u002Fdiv>\n\n<h2 id=\"contact\">Contact<\u002Fh2>\n\n<ul class=\"contact-list\">\n  <li>\n    <!-- building icon -->\n    <svg class=\"icon\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n      <rect x=\"3\" y=\"7\" width=\"14\" height=\"11\" rx=\"1\"><\u002Frect><path d=\"M1 7l9-5 9 5\"><\u002Fpath><path d=\"M8 18v-5h4v5\"><\u002Fpath>\n    <\u002Fsvg>\n    <span>Department of Economics, Miami University<\u002Fspan>\n  <\u002Fli>\n  <li>\n    <!-- envelope icon -->\n    <svg class=\"icon\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n      <rect x=\"2\" y=\"  { rootMargin: '-40% 0px -55% 0px', threshold: 0 });\n    sections.forEach(function (s) { observer.observe(s); });\n  }\n})();\n<\u002Fscript><\u002Fbody><\u002Fhtml>"
