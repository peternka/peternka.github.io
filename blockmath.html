<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF4D6">
<title>Block Math Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Bowlby+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF4D6;
    --bg-2: #FFE9B0;
    --ink: #2B2118;
    --ink-soft: #5C4A38;
    --paper: #FFFDF6;
    --line: #2B2118;
    --good: #4CB85C;
    --bad: #E94B4B;
    --accent: #FFB400;
    --shadow: 0 4px 0 var(--line);
    --shadow-lg: 0 6px 0 var(--line);

    /* Numberblocks-inspired palette */
    --n1: #E63946;   --n2: #F77F00;   --n3: #FCD53F;
    --n4: #6BCB77;   --n5: #4DA8DA;   --n6: #8E4FB0;
    --n7: #F49AC2;   --n8: #14B8B0;   --n9: #2E5BFF;
    --n10: #F8F8F8;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  body {
    font-family: 'Fredoka', sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 10% 20%, rgba(255,180,0,0.15) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(77,168,218,0.15) 0%, transparent 40%);
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;
    font-size: 18px;
    overscroll-behavior: none;
  }

  /* Notebook dotted background */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image: radial-gradient(circle, rgba(43,33,24,0.06) 1px, transparent 1.5px);
    background-size: 22px 22px;
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 540px;
    margin: 0 auto;
    padding: 16px 16px 32px;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ===== HEADER ===== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
  }
  .logo {
    font-family: 'Bowlby One', sans-serif;
    font-size: 22px;
    line-height: 1;
    letter-spacing: -0.5px;
    color: var(--ink);
  }
  .logo span { color: var(--n1); }
  .logo span:nth-child(2) { color: var(--n4); }
  .logo span:nth-child(3) { color: var(--n5); }
  .logo span:nth-child(4) { color: var(--n6); }

  .icon-btn {
    border: 3px solid var(--line);
    background: var(--paper);
    width: 44px; height: 44px;
    border-radius: 14px;
    display: grid; place-items: center;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.1s, box-shadow 0.1s;
    font-size: 22px;
    padding: 0;
  }
  .icon-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--line); }

  /* ===== PROGRESS BAR (during quiz) ===== */
  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .progress-track {
    flex: 1;
    height: 16px;
    background: var(--paper);
    border: 3px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--n4), var(--n3));
    transition: width 0.3s ease;
    width: 0%;
  }
  .streak {
    font-family: 'Bowlby One', sans-serif;
    font-size: 18px;
    display: flex; align-items: center; gap: 4px;
    color: var(--n2);
  }

  /* ===== SCREENS ===== */
  .screen { display: none; flex-direction: column; flex: 1; animation: fadeIn 0.3s ease; }
  .screen.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to {opacity:1; transform: none;} }

  /* ===== HOME / LEVEL SELECT ===== */
  .hero {
    background: var(--paper);
    border: 3px solid var(--line);
    border-radius: 22px;
    padding: 18px 18px 16px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-lg);
    position: relative;
    overflow: hidden;
  }
  .hero h1 {
    font-family: 'Bowlby One', sans-serif;
    font-size: 26px;
    line-height: 1.1;
    margin: 0 0 6px;
  }
  .hero p { margin: 0; color: var(--ink-soft); font-size: 15px; }
  .hero-blocks {
    display: flex; gap: 6px; margin-top: 12px;
    flex-wrap: wrap;
  }
  .hero-blocks .mini-block {
    width: 28px; height: 28px;
    border: 2.5px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 2.5px 0 var(--line);
  }

  .section-title {
    font-family: 'Bowlby One', sans-serif;
    font-size: 18px;
    margin: 8px 4px 10px;
    display: flex; align-items: center; gap: 8px;
  }

  .levels-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .level-card {
    background: var(--paper);
    border: 3px solid var(--line);
    border-radius: 18px;
    padding: 14px 12px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.1s, box-shadow 0.1s;
    text-align: left;
    font-family: inherit;
    color: inherit;
    position: relative;
    overflow: hidden;
    min-height: 110px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .level-card:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--line); }
  .level-card.locked {
    opacity: 0.55;
    cursor: not-allowed;
    background: var(--bg-2);
  }
  .level-card.locked:active { transform: none; box-shadow: var(--shadow); }
  .level-num {
    font-family: 'Bowlby One', sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .level-title {
    font-family: 'Bowlby One', sans-serif;
    font-size: 16px;
    line-height: 1.15;
    margin: 4px 0 8px;
  }
  .level-emoji {
    font-size: 28px;
    line-height: 1;
    position: absolute;
    top: 10px; right: 12px;
    opacity: 0.85;
  }
  .level-stars {
    display: flex; gap: 2px;
    font-size: 14px;
  }
  .star { color: #d8d0c0; }
  .star.lit { color: var(--accent); text-shadow: 0 1px 0 var(--line); }
  .level-best {
    font-size: 11px;
    color: var(--ink-soft);
    margin-left: auto;
    font-weight: 600;
  }

  /* ===== QUIZ SCREEN ===== */
  .question-card {
    background: var(--paper);
    border: 3px solid var(--line);
    border-radius: 22px;
    padding: 22px 16px 24px;
    box-shadow: var(--shadow-lg);
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 240px;
    justify-content: center;
    gap: 10px;
  }
  .question-text {
    font-family: 'Bowlby One', sans-serif;
    font-size: 22px;
    text-align: center;
    margin: 0;
    line-height: 1.25;
  }
  .question-sub {
    color: var(--ink-soft);
    font-size: 14px;
    text-align: center;
    margin: 20px 0 0;
    padding-top: 4px;
    line-height: 1.4;
    max-width: 95%;
  }

  /* Block visuals */
  .blocks-stage {
    display: flex;
    flex-wrap: wrap;
    gap: 16px 22px;
    justify-content: center;
    align-items: flex-end;
    width: 100%;
    margin: 6px 0 10px;
    padding: 0 4px 4px;
  }
  .block-tower {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .block-tower-stack {
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
    gap: 0;
  }
  .tower-label {
    font-family: 'Bowlby One', sans-serif;
    font-size: 15px;
    color: var(--ink-soft);
    margin-top: 6px;
    padding-top: 2px;
  }
  /* legacy support */
  .block-tower .label { display: none; }
  .cube {
    width: 32px; height: 32px;
    border: 2.5px solid var(--line);
    border-radius: 7px;
    box-shadow: 0 2.5px 0 var(--line), inset -3px -3px 0 rgba(0,0,0,0.12), inset 3px 3px 0 rgba(255,255,255,0.25);
    position: relative;
    animation: pop 0.3s cubic-bezier(.4,1.6,.5,1) backwards;
  }
  .cube.small { width: 22px; height: 22px; border-radius: 5px; }
  .cube.tiny { width: 16px; height: 16px; border-radius: 4px; border-width: 2px; }
  .cube.face::before {
    content: ""; position: absolute;
    left: 22%; top: 30%;
    width: 14%; height: 14%;
    border-radius: 50%; background: var(--line);
    box-shadow: 110% 0 0 var(--line);
  }
  .cube.face::after {
    content: ""; position: absolute;
    left: 30%; bottom: 22%;
    width: 40%; height: 10%;
    border-radius: 50%;
    background: var(--line);
  }
  @keyframes pop {
    from { transform: scale(0) rotate(-10deg); opacity: 0; }
    to { transform: scale(1) rotate(0); opacity: 1; }
  }

  /* Grid of cubes for big numbers */
  .cube-grid {
    display: grid;
    gap: 3px;
    padding: 8px;
    background: rgba(0,0,0,0.04);
    border: 2px dashed var(--ink-soft);
    border-radius: 10px;
  }

  /* operator */
  .operator {
    font-family: 'Bowlby One', sans-serif;
    font-size: 32px;
    align-self: center;
    color: var(--ink-soft);
    padding: 0 4px;
  }

  /* ===== ANSWER AREA ===== */
  .answers {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 8px;
  }
  .answer-btn {
    background: var(--paper);
    border: 3px solid var(--line);
    border-radius: 16px;
    padding: 16px 8px;
    font-family: 'Bowlby One', sans-serif;
    font-size: 22px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.1s, box-shadow 0.1s, background 0.2s;
    color: var(--ink);
    min-height: 64px;
  }
  .answer-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--line); }
  .answer-btn.correct { background: var(--good); color: white; animation: shake-good 0.4s; }
  .answer-btn.wrong { background: var(--bad); color: white; animation: shake-bad 0.4s; }
  .answer-btn:disabled { cursor: not-allowed; }
  .answer-btn.fade { opacity: 0.4; }

  @keyframes shake-good { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
  @keyframes shake-bad { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  /* Typed input answer — stacked vertically: input on top, button below */
  .typed-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }
  .typed-input {
    width: 100%;
    background: var(--paper);
    border: 3px solid var(--line);
    border-radius: 16px;
    font-family: 'Bowlby One', sans-serif;
    font-size: 26px;
    padding: 16px 12px;
    box-shadow: var(--shadow);
    color: var(--ink);
    text-align: center;
    -moz-appearance: textfield;
    box-sizing: border-box;
  }
  .typed-input:focus { outline: none; border-color: var(--n5); }
  .typed-input::-webkit-outer-spin-button,
  .typed-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .check-btn {
    width: 100%;
    background: var(--n4);
    border: 3px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    font-family: 'Bowlby One', sans-serif;
    font-size: 18px;
    cursor: pointer;
    box-shadow: var(--shadow);
    color: var(--ink);
    transition: transform 0.1s, box-shadow 0.1s;
    box-sizing: border-box;
  }
  .check-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--line); }
  .check-btn.correct { background: var(--good); color: white; }
  .check-btn.wrong { background: var(--bad); color: white; }

  /* Feedback bar */
  .feedback {
    text-align: center;
    font-family: 'Bowlby One', sans-serif;
    font-size: 16px;
    min-height: 24px;
    margin: 8px 0;
    color: var(--ink-soft);
  }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }

  .footer-row {
    display: flex; gap: 8px;
    margin-top: auto;
    padding-top: 8px;
  }
  .ghost-btn {
    background: transparent;
    border: 3px solid var(--line);
    color: var(--ink);
    border-radius: 14px;
    padding: 10px 14px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  .next-btn {
    flex: 1;
    background: var(--n3);
    border: 3px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    font-family: 'Bowlby One', sans-serif;
    font-size: 18px;
    cursor: pointer;
    box-shadow: var(--shadow);
    color: var(--ink);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .next-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--line); }
  .next-btn[hidden] { display: none; }

  /* ===== CELEBRATION ===== */
  .celebration {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 100;
    overflow: hidden;
  }
  .confetti {
    position: absolute;
    width: 12px; height: 12px;
    border: 2px solid var(--line);
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); }
  }

  /* ===== LEVEL COMPLETE MODAL ===== */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(43,33,24,0.5);
    display: none;
    align-items: center; justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .modal-bg.show { display: flex; animation: fadeIn 0.2s; }
  .modal {
    background: var(--paper);
    border: 3px solid var(--line);
    border-radius: 22px;
    padding: 24px;
    box-shadow: 0 8px 0 var(--line);
    max-width: 360px;
    width: 100%;
    text-align: center;
    animation: pop 0.4s cubic-bezier(.4,1.6,.5,1);
  }
  .modal h2 {
    font-family: 'Bowlby One', sans-serif;
    font-size: 28px;
    margin: 0 0 6px;
  }
  .modal-stars {
    font-size: 40px;
    margin: 6px 0;
    letter-spacing: 4px;
  }
  .modal-btns {
    display: flex; gap: 10px; margin-top: 16px;
  }
  .modal-btns button {
    flex: 1;
    padding: 12px;
    font-family: 'Bowlby One', sans-serif;
    font-size: 15px;
    border: 3px solid var(--line);
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--line);
  }
  .btn-primary { background: var(--n3); color: var(--ink); }
  .btn-secondary { background: var(--paper); color: var(--ink); }

  /* Fraction / expression display */
  .frac {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    vertical-align: middle;
    margin: 0 4px;
    font-family: 'Bowlby One', sans-serif;
  }
  .frac .num, .frac .den {
    padding: 0 6px;
    font-size: 22px;
    line-height: 1.1;
  }
  .frac .bar { width: 100%; height: 3px; background: var(--ink); border-radius: 2px; }

  /* Pie fraction visual — SVG-based, just wrap row */
  .pie-row { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; align-items: center; padding: 4px 0; }

  /* Number line */
  .numline {
    width: 100%;
    height: 60px;
    position: relative;
    margin: 8px 0;
  }
  .numline svg { width: 100%; height: 100%; display: block; }

  /* Small screens */
  @media (max-width: 360px) {
    .app { padding: 12px; }
    .question-text { font-size: 19px; }
    .cube { width: 26px; height: 26px; }
    .cube.small { width: 18px; height: 18px; }
  }

  /* Level badge color tabs at top of card */
  .level-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: var(--tab, var(--n3));
  }

  /* Block character on home */
  .mascot {
    position: absolute;
    right: 14px;
    top: 18px;
    font-size: 64px;
    line-height: 1;
    transform: rotate(8deg);
    pointer-events: none;
    user-select: none;
  }

  /* Hint pill */
  .hint-pill {
    display: inline-block;
    background: var(--bg-2);
    border: 2px solid var(--line);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<div class="app">

  <!-- HOME SCREEN -->
  <div id="screen-home" class="screen active">
    <div class="topbar">
      <div class="logo"><span>B</span>l<span>o</span>ck <span>M</span>a<span>t</span>h</div>
      <button class="icon-btn" id="btn-reset" title="Reset progress">↻</button>
    </div>

    <div class="hero">
      <h1>Let's count, build &amp; solve!</h1>
      <p>Pick a level. Get questions forever. Earn stars.</p>
      <div class="hero-blocks" id="hero-blocks"></div>
    </div>

    <div class="section-title">🎯 Levels</div>
    <div class="levels-grid" id="levels-grid"></div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="screen-quiz" class="screen">
    <div class="topbar">
      <button class="icon-btn" id="btn-home">←</button>
      <div class="logo" id="quiz-title" style="font-size:16px;">Level</div>
      <div class="streak" id="streak-display">🔥 0</div>
    </div>

    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div style="font-family:'Bowlby One',sans-serif; font-size:14px;" id="progress-text">0/10</div>
    </div>

    <div class="question-card" id="question-card">
      <!-- filled by JS -->
    </div>

    <div id="answer-area"></div>

    <div class="feedback" id="feedback">&nbsp;</div>

    <div class="footer-row">
      <button class="ghost-btn" id="btn-skip">Skip</button>
      <button class="next-btn" id="btn-next" hidden>Next →</button>
    </div>
  </div>

</div>

<!-- Confetti container -->
<div class="celebration" id="celebration"></div>

<!-- Level complete modal -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h2 id="modal-title">Level Complete!</h2>
    <div class="modal-stars" id="modal-stars">⭐⭐⭐</div>
    <p id="modal-msg" style="margin:6px 0 0; color:var(--ink-soft);">Great job!</p>
    <div class="modal-btns">
      <button class="btn-secondary" id="btn-modal-home">Home</button>
      <button class="btn-primary" id="btn-modal-next">Next Level →</button>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   BLOCK MATH ADVENTURE
   Numberblocks-inspired infinite math problem generator.
   Each level has its own generator: returns { question, answer, render, choices? }
   ========================================================================= */

// ---------- Color palette (matches Numberblocks-style) ----------
const BLOCK_COLORS = [
  null,
  '#E63946', // 1 red
  '#F77F00', // 2 orange
  '#FCD53F', // 3 yellow
  '#6BCB77', // 4 green
  '#4DA8DA', // 5 light blue
  '#8E4FB0', // 6 purple
  '#F49AC2', // 7 pink
  '#14B8B0', // 8 teal
  '#2E5BFF', // 9 dark blue
  '#FF8FA3', // 10 rainbow-pink (was nearly invisible white)
];
function blockColor(n) {
  if (n <= 0) return '#cccccc';
  if (n <= 10) return BLOCK_COLORS[n];
  // After 10, cycle through with slight shifts
  const palette = ['#FF6B6B','#FFA94D','#FFD43B','#69DB7C','#4DABF7','#9775FA','#F783AC','#3BC9DB','#5C7CFA','#F06595'];
  return palette[n % palette.length];
}

// ---------- Utility ----------
const $ = (id) => document.getElementById(id);
const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const choice = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

// Generates plausible-looking wrong answers near the correct one
function makeChoices(correct, count = 4, range = 4, integerOnly = true) {
  const set = new Set([correct]);
  let attempts = 0;
  while (set.size < count && attempts < 50) {
    let off = rnd(-range, range);
    if (off === 0) off = rnd(1, range) * (Math.random() < 0.5 ? -1 : 1);
    let val = correct + off;
    if (integerOnly) val = Math.round(val);
    if (val < 0 && correct >= 0) val = correct + rnd(1, range);
    set.add(val);
    attempts++;
  }
  while (set.size < count) set.add(correct + set.size);
  return shuffle(Array.from(set));
}

// Generates choices within a min/max range. Guaranteed `count` unique values including `correct`.
function makeChoicesInRange(correct, min, max, count = 4, range = 4) {
  const set = new Set([correct]);
  let attempts = 0;
  while (set.size < count && attempts < 60) {
    let off = rnd(-range, range);
    if (off === 0) off = rnd(1, range) * (Math.random() < 0.5 ? -1 : 1);
    let val = correct + off;
    if (val < min) val = min + (set.size);
    if (val > max) val = max - (set.size);
    if (val >= min && val <= max && val !== correct) set.add(val);
    attempts++;
  }
  // Pad with random values in range if still short
  while (set.size < count) {
    const v = rnd(min, max);
    set.add(v);
  }
  return shuffle(Array.from(set));
}

// ---------- Shape & object renderers ----------
// Render an SVG shape. type: circle|square|triangle|star|heart|diamond|pentagon|hexagon|oval
function shapeSVG(type, color, size = 36) {
  const s = size, h = s, w = s;
  const stroke = '#2B2118', sw = 2.5;
  let inner = '';
  switch(type) {
    case 'circle':
      inner = `<circle cx="${w/2}" cy="${h/2}" r="${w/2 - sw}" fill="${color}" stroke="${stroke}" stroke-width="${sw}"/>`;
      break;
    case 'square':
      inner = `<rect x="${sw}" y="${sw}" width="${w-sw*2}" height="${h-sw*2}" rx="4" fill="${color}" stroke="${stroke}" stroke-width="${sw}"/>`;
      break;
    case 'triangle':
      inner = `<polygon points="${w/2},${sw+1} ${w-sw},${h-sw} ${sw},${h-sw}" fill="${color}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;
      break;
    case 'star': {
      const cx = w/2, cy = h/2, r1 = w/2 - sw, r2 = r1 * 0.45;
      let pts = '';
      for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? r1 : r2;
        const a = -Math.PI/2 + i * Math.PI/5;
        pts += `${cx + Math.cos(a)*r},${cy + Math.sin(a)*r} `;
      }
      inner = `<polygon points="${pts.trim()}" fill="${color}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;
      break;
    }
    case 'heart':
      inner = `<path d="M${w/2},${h*0.85} C${w*0.1},${h*0.55} ${w*0.1},${h*0.2} ${w/2},${h*0.35} C${w*0.9},${h*0.2} ${w*0.9},${h*0.55} ${w/2},${h*0.85} Z" fill="${color}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;
      break;
    case 'diamond':
      inner = `<polygon points="${w/2},${sw} ${w-sw},${h/2} ${w/2},${h-sw} ${sw},${h/2}" fill="${color}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;
      break;
    case 'pentagon': {
      const cx = w/2, cy = h/2, r = w/2 - sw;
      let pts = '';
      for (let i = 0; i < 5; i++) {
        const a = -Math.PI/2 + i * 2*Math.PI/5;
        pts += `${cx + Math.cos(a)*r},${cy + Math.sin(a)*r} `;
      }
      inner = `<polygon points="${pts.trim()}" fill="${color}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;
      break;
    }
    case 'hexagon': {
      const cx = w/2, cy = h/2, r = w/2 - sw;
      let pts = '';
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI/3;
        pts += `${cx + Math.cos(a)*r},${cy + Math.sin(a)*r} `;
      }
      inner = `<polygon points="${pts.trim()}" fill="${color}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;
      break;
    }
    case 'oval':
      inner = `<ellipse cx="${w/2}" cy="${h/2}" rx="${w/2-sw}" ry="${h*0.35}" fill="${color}" stroke="${stroke}" stroke-width="${sw}"/>`;
      break;
    case 'rectangle':
      inner = `<rect x="${sw}" y="${h*0.25}" width="${w-sw*2}" height="${h*0.5}" rx="4" fill="${color}" stroke="${stroke}" stroke-width="${sw}"/>`;
      break;
  }
  return `<svg viewBox="0 0 ${w} ${h}" width="${s}" height="${s}" style="display:block;">${inner}</svg>`;
}

// Two-group objects with operator (for add/sub story problems)
function objectGroups(a, b, op, obj) {
  const fontSize = 32;
  let html = `<div style="display:flex; gap:14px; justify-content:center; align-items:center; flex-wrap:wrap;">`;
  html += `<div style="display:flex; gap:3px; flex-wrap:wrap; max-width:140px; justify-content:center;">`;

// Shape parade

  types.forEach((t, i) => {

// ---------- Cube renderer ----------
function cubeHTML(color, opts = {}) {
  const cls = opts.size === 'small' ? 'cube small' : opts.size === 'tiny' ? 'cube tiny' : 'cube';
  const faceClass = opts.face ? ' face' : '';
  const delay = opts.delay ? `style="background:${color}; animation-delay:${opts.delay}ms;"` : `style="background:${color};"`;
  return `<div class="${cls}${faceClass}" ${delay}></div>`;
}

// Vertical tower of N cubes, color based on count (matches Numberblocks: count = identity)
function tower(n, opts = {}) {
  if (n <= 0) return '<div style="padding:8px 12px; font-style:italic; color:var(--ink-soft);">zero</div>';
  const color = opts.color || blockColor(n);
  let stack = '<div class="block-tower-stack">';
  for (let i = 0; i < n; i++) {
    const face = (opts.face && i === n - 1); // top cube has face
    stack += cubeHTML(color, { size: opts.size, face, delay: i * 40 });
  }
  stack += '</div>';
  const label = (opts.label !== false)
    ? `<div class="tower-label">${opts.labelText !== undefined ? opts.labelText : n}</div>`
    : '';
  return `<div class="block-tower">${stack}${label}</div>`;
}

// Compact grid for larger numbers (e.g., place value)
function grid(n, perRow = 10, opts = {}) {
  const color = opts.color || blockColor(Math.min(n, 10));
  const size = opts.size || 'tiny';
  const rows = Math.ceil(n / perRow);
  const cubes = Math.min(n, rows * perRow);
  let html = `<div class="cube-grid" style="grid-template-columns: repeat(${Math.min(n, perRow)}, auto);">`;
  for (let i = 0; i < n; i++) {
    html += cubeHTML(color, { size, delay: i * 8 });
  }
  html += '</div>';
  return html;
}

// Place-value column: rod of 10 (single tall block), individual ones
function placeValue(num) {
  const tens = Math.floor(num / 10);
  const ones = num % 10;
  let html = '<div class="blocks-stage">';
  // tens rods — use the new tower structure (stack + outside label)
  for (let t = 0; t < tens; t++) {
    html += '<div class="block-tower"><div class="block-tower-stack">';
    for (let i = 0; i < 10; i++) html += cubeHTML('#FFD93D', { size: 'small', delay: i*15 });
    html += '</div><div class="tower-label" style="font-size:12px;">10</div></div>';
  }
  // ones
  if (ones > 0) {
    html += tower(ones, { color: blockColor(ones), size: 'small', labelText: ones });
  }
  html += '</div>';
  return html;
}

// Rectangle for multiplication (a rows × b cols)
function rectangle(rows, cols, color) {
  const c = color || blockColor(rows);
  let html = `<div class="cube-grid" style="grid-template-columns: repeat(${cols}, auto);">`;
  for (let i = 0; i < rows * cols; i++) {
    html += cubeHTML(c, { size: 'small', delay: i * 12 });
  }
  html += '</div>';
  return html;
}

// Pie chart for fractions — SVG-based for crisp slices and no leakage
function pieFraction(num, den, color, size) {
  const c = color || '#FF6B6B';
  const s = size || 96;
  const cx = s / 2, cy = s / 2;
  const r = s / 2 - 5;  // leave room for stroke
  const stroke = '#2B2118', sw = 3.5;

  // Helper: build a wedge path for slice i (0-indexed), starting from 12 o'clock, clockwise
  function wedgePath(i) {
    const sliceAngle = 2 * Math.PI / den;
    const a1 = -Math.PI / 2 + i * sliceAngle;       // start angle
    const a2 = -Math.PI / 2 + (i + 1) * sliceAngle; // end angle
    const x1 = cx + r * Math.cos(a1);
    const y1 = cy + r * Math.sin(a1);
    const x2 = cx + r * Math.cos(a2);
    const y2 = cy + r * Math.sin(a2);
    const largeArc = sliceAngle > Math.PI ? 1 : 0;
    return `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z`;
  }

  let slices = '';
  for (let i = 0; i < den; i++) {
    const fill = i < num ? c : '#FFFDF6';
    if (den === 1) {
      slices += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}"/>`;
    } else {
      // Each wedge gets its own thin outline so adjacent same-color slices show divider
      slices += `<path d="${wedgePath(i)}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;
    }
  }

  // Outer circle for crisp border
  const outline = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${stroke}" stroke-width="${sw}"/>`;

  return `<svg viewBox="0 0 ${s} ${s}" width="${s}" height="${s}" style="display:block; filter: drop-shadow(0 3px 0 ${stroke}); shape-rendering: geometricPrecision;">
    ${slices}
    ${outline}
  </svg>`;
}

// Number line SVG (for negatives / number sense)
function numberLine(min, max, marks = []) {
  const w = 320, h = 60;
  const pad = 20;
  const span = max - min;
  const x = v => pad + (v - min) / span * (w - pad*2);
  let svg = `<div class="numline"><svg viewBox="0 0 ${w} ${h}">`;
  svg += `<line x1="${pad}" y1="30" x2="${w-pad}" y2="30" stroke="#2B2118" stroke-width="3" stroke-linecap="round"/>`;
  for (let v = min; v <= max; v++) {
    const xx = x(v);
    svg += `<line x1="${xx}" y1="26" x2="${xx}" y2="34" stroke="#2B2118" stroke-width="2"/>`;
    svg += `<text x="${xx}" y="50" text-anchor="middle" font-family="Fredoka" font-size="11" fill="#5C4A38">${v}</text>`;
  }
  marks.forEach(m => {
    svg += `<circle cx="${x(m.v)}" cy="30" r="7" fill="${m.color || '#E63946'}" stroke="#2B2118" stroke-width="2.5"/>`;
    if (m.label) svg += `<text x="${x(m.v)}" y="18" text-anchor="middle" font-family="Bowlby One" font-size="11" fill="#2B2118">${m.label}</text>`;
  });
  svg += `</svg></div>`;
  return svg;
}

// ---------- Clock face ----------
function clockFace(hour, minute, opts = {}) {
  const s = opts.size || 160;
  const cx = s/2, cy = s/2;
  const r = s/2 - 6;
  const stroke = '#2B2118';
  let svg = `<svg viewBox="0 0 ${s} ${s}" width="${s}" height="${s}" style="display:block; filter: drop-shadow(0 4px 0 ${stroke});">`;
  svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#FFFDF6" stroke="${stroke}" stroke-width="3.5"/>`;
  // Hour numbers and tick marks
  for (let h = 1; h <= 12; h++) {
    const angle = (h * 30 - 90) * Math.PI / 180;
    const x = cx + (r - 16) * Math.cos(angle);
    const y = cy + (r - 16) * Math.sin(angle);
    svg += `<text x="${x}" y="${y + 5}" text-anchor="middle" font-family="Bowlby One" font-size="14" fill="${stroke}">${h}</text>`;
    // Tick at edge
    const tx1 = cx + r * Math.cos(angle), ty1 = cy + r * Math.sin(angle);
    const tx2 = cx + (r - 5) * Math.cos(angle), ty2 = cy + (r - 5) * Math.sin(angle);
    svg += `<line x1="${tx1}" y1="${ty1}" x2="${tx2}" y2="${ty2}" stroke="${stroke}" stroke-width="2"/>`;
  }
  // Minute marks (small)
  for (let m = 0; m < 60; m++) {
    if (m % 5 === 0) continue;
    const angle = (m * 6 - 90) * Math.PI / 180;
    const tx1 = cx + r * Math.cos(angle), ty1 = cy + r * Math.sin(angle);
    const tx2 = cx + (r - 2.5) * Math.cos(angle), ty2 = cy + (r - 2.5) * Math.sin(angle);
    svg += `<line x1="${tx1}" y1="${ty1}" x2="${tx2}" y2="${ty2}" stroke="${stroke}" stroke-width="1" opacity="0.5"/>`;
  }
  // Hour hand
  const hourAngle = ((hour % 12) * 30 + (minute / 60) * 30 - 90) * Math.PI / 180;
  const hx = cx + (r * 0.5) * Math.cos(hourAngle);
  const hy = cy + (r * 0.5) * Math.sin(hourAngle);
  svg += `<line x1="${cx}" y1="${cy}" x2="${hx}" y2="${hy}" stroke="#E63946" stroke-width="5" stroke-linecap="round"/>`;
  // Minute hand
  const minAngle = (minute * 6 - 90) * Math.PI / 180;
  const mx = cx + (r * 0.78) * Math.cos(minAngle);
  const my = cy + (r * 0.78) * Math.sin(minAngle);
  svg += `<line x1="${cx}" y1="${cy}" x2="${mx}" y2="${my}" stroke="#2E5BFF" stroke-width="3" stroke-linecap="round"/>`;
  // Center dot
  svg += `<circle cx="${cx}" cy="${cy}" r="5" fill="${stroke}"/>`;
  svg += `</svg>`;
  return svg;
}

// ---------- Die face (1-6) ----------
function dieFace(value, opts = {}) {
  const s = opts.size || 60;
  const color = opts.color || '#FFFDF6';
  const stroke = '#2B2118';
  // Pip layouts: index 0..6 used (1-6)
  const layouts = {
    1: [[0.5, 0.5]],
    2: [[0.25, 0.25], [0.75, 0.75]],
    3: [[0.25, 0.25], [0.5, 0.5], [0.75, 0.75]],
    4: [[0.25, 0.25], [0.75, 0.25], [0.25, 0.75], [0.75, 0.75]],
    5: [[0.25, 0.25], [0.75, 0.25], [0.5, 0.5], [0.25, 0.75], [0.75, 0.75]],
    6: [[0.25, 0.25], [0.75, 0.25], [0.25, 0.5], [0.75, 0.5], [0.25, 0.75], [0.75, 0.75]]
  };
  const pips = layouts[value] || [];
  let svg = `<svg viewBox="0 0 ${s} ${s}" width="${s}" height="${s}" style="display:block; filter: drop-shadow(0 3px 0 ${stroke});">`;
  svg += `<rect x="3" y="3" width="${s-6}" height="${s-6}" rx="${s*0.15}" fill="${color}" stroke="${stroke}" stroke-width="3"/>`;
  pips.forEach(([px, py]) => {
    svg += `<circle cx="${px*s}" cy="${py*s}" r="${s*0.08}" fill="${stroke}"/>`;
  });
  svg += `</svg>`;
  return svg;
}

// ---------- Spinner (colored sectors) ----------
function spinner(sectors, opts = {}) {
  // sectors: array of {color, label?}
  const s = opts.size || 140;
  const cx = s/2, cy = s/2;
  const r = s/2 - 6;
  const stroke = '#2B2118';
  const den = sectors.length;
  let svg = `<svg viewBox="0 0 ${s} ${s}" width="${s}" height="${s}" style="display:block; filter: drop-shadow(0 3px 0 ${stroke});">`;
  for (let i = 0; i < den; i++) {
    const sliceAngle = 2 * Math.PI / den;
    const a1 = -Math.PI/2 + i * sliceAngle;
    const a2 = -Math.PI/2 + (i+1) * sliceAngle;
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
    const largeArc = sliceAngle > Math.PI ? 1 : 0;
    const d = den === 1
      ? `M ${cx-r} ${cy} A ${r} ${r} 0 1 1 ${cx+r} ${cy} A ${r} ${r} 0 1 1 ${cx-r} ${cy} Z`
      : `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z`;
    svg += `<path d="${d}" fill="${sectors[i].color}"/>`;
  }
  // Dividers
  for (let i = 0; i < den; i++) {
    const angle = -Math.PI/2 + i * (2*Math.PI/den);
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    svg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${stroke}" stroke-width="2.5"/>`;
  }
  // Outline
  svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${stroke}" stroke-width="3"/>`;
  // Pointer at top
  svg += `<polygon points="${cx},${cy-r-2} ${cx-7},${cy-r+12} ${cx+7},${cy-r+12}" fill="${stroke}"/>`;
  // Center
  svg += `<circle cx="${cx}" cy="${cy}" r="6" fill="${stroke}"/>`;
  svg += `</svg>`;
  return svg;
}

// ---------- Dot pattern (for triangular numbers etc.) ----------
function dotTriangle(n, color, opts = {}) {
  const dotSize = opts.dotSize || 14;
  const gap = opts.gap || 4;
  let html = '<div style="display:flex; flex-direction:column-reverse; gap:' + gap + 'px; align-items:center;">';
  for (let row = 1; row <= n; row++) {
    html += '<div style="display:flex; gap:' + gap + 'px;">';
    for (let col = 0; col < row; col++) {
      html += `<div style="width:${dotSize}px; height:${dotSize}px; border-radius:50%; background:${color || blockColor(row)}; border:2px solid var(--line); animation: pop 0.35s cubic-bezier(.4,1.6,.5,1) backwards; animation-delay:${(row*row + col)*15}ms;"></div>`;
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}

// ---------- 2D Grid for coordinate / vector visualization ----------
function coordGrid(opts = {}) {
  const size = opts.size || 220;
  const min = opts.min !== undefined ? opts.min : -5;
  const max = opts.max !== undefined ? opts.max : 5;
  const stroke = '#2B2118';
  const span = max - min;
  const pad = 18;
  const inner = size - pad*2;
  const xFn = v => pad + ((v - min) / span) * inner;
  const yFn = v => pad + ((max - v) / span) * inner;
  let svg = `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="display:block;">`;
  // Grid lines
  for (let v = min; v <= max; v++) {
    svg += `<line x1="${xFn(v)}" y1="${pad}" x2="${xFn(v)}" y2="${size-pad}" stroke="#d8d0c0" stroke-width="1"/>`;
    svg += `<line x1="${pad}" y1="${yFn(v)}" x2="${size-pad}" y2="${yFn(v)}" stroke="#d8d0c0" stroke-width="1"/>`;
  }
  // Axes (x=0, y=0)
  svg += `<line x1="${pad}" y1="${yFn(0)}" x2="${size-pad}" y2="${yFn(0)}" stroke="${stroke}" stroke-width="2"/>`;
  svg += `<line x1="${xFn(0)}" y1="${pad}" x2="${xFn(0)}" y2="${size-pad}" stroke="${stroke}" stroke-width="2"/>`;
  // Tick labels
  for (let v = min; v <= max; v++) {
    if (v === 0) continue;
    svg += `<text x="${xFn(v)}" y="${yFn(0)+12}" text-anchor="middle" font-family="Fredoka" font-size="9" fill="#5C4A38">${v}</text>`;
    svg += `<text x="${xFn(0)-8}" y="${yFn(v)+3}" text-anchor="end" font-family="Fredoka" font-size="9" fill="#5C4A38">${v}</text>`;
  }
  // Vectors: array of {from:[x,y], to:[x,y], color}
  if (opts.vectors) {
    opts.vectors.forEach(vec => {
      const c = vec.color || '#E63946';
      const x1 = xFn(vec.from[0]), y1 = yFn(vec.from[1]);
      const x2 = xFn(vec.to[0]), y2 = yFn(vec.to[1]);
      svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="3.5" stroke-linecap="round"/>`;
      // Arrowhead
      const ang = Math.atan2(y2 - y1, x2 - x1);
      const ah = 9;
      const a1x = x2 - ah * Math.cos(ang - Math.PI/6);
      const a1y = y2 - ah * Math.sin(ang - Math.PI/6);
      const a2x = x2 - ah * Math.cos(ang + Math.PI/6);
      const a2y = y2 - ah * Math.sin(ang + Math.PI/6);
      svg += `<polygon points="${x2},${y2} ${a1x},${a1y} ${a2x},${a2y}" fill="${c}"/>`;
    });
  }
  // Points: array of {x, y, color, label}
  if (opts.points) {
    opts.points.forEach(pt => {
      svg += `<circle cx="${xFn(pt.x)}" cy="${yFn(pt.y)}" r="6" fill="${pt.color || '#E63946'}" stroke="${stroke}" stroke-width="2"/>`;
      if (pt.label) {
        svg += `<text x="${xFn(pt.x)+10}" y="${yFn(pt.y)-8}" font-family="Bowlby One" font-size="11" fill="${stroke}">${pt.label}</text>`;
      }
    });
  }
  svg += `</svg>`;
  return svg;
}

// ---------- Bar chart (for rate of change / step area) ----------
function barChart(values, opts = {}) {
  const w = opts.width || 280;
  const h = opts.height || 140;
  const stroke = '#2B2118';
  const n = values.length;
  const pad = 16;
  const max = Math.max(...values, 1);
  const barW = (w - pad*2) / n - 4;
  let svg = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block;">`;
  // Axes
  svg += `<line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="${stroke}" stroke-width="2"/>`;
  svg += `<line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="${stroke}" stroke-width="2"/>`;
  values.forEach((v, i) => {
    const barH = (v / max) * (h - pad*2 - 4);
    const x = pad + 4 + i * ((w - pad*2) / n);
    const y = h - pad - barH;
    const color = opts.colors ? opts.colors[i] : blockColor((i % 9) + 1);
    svg += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" fill="${color}" stroke="${stroke}" stroke-width="2" rx="3"/>`;
    svg += `<text x="${x + barW/2}" y="${h - pad + 13}" text-anchor="middle" font-family="Fredoka" font-size="10" fill="#5C4A38">${opts.labels ? opts.labels[i] : i+1}</text>`;
    svg += `<text x="${x + barW/2}" y="${y - 4}" text-anchor="middle" font-family="Bowlby One" font-size="11" fill="${stroke}">${v}</text>`;
  });
  svg += `</svg>`;
  return svg;
}

  // levelId -> { best: 0-10, stars: 0-3, unlocked: bool }
};
LEVELS.forEach((lv, i) => {
  userProgress[lv.id] = { best: 0, stars: 0, unlocked: true };
});

// ============================================================
// HOME SCREEN
// ============================================================
function renderHome() {
  // Hero blocks decoration
  const heroBlocks = $('hero-blocks');
  heroBlocks.innerHTML = '';
  for (let i = 1; i <= 10; i++) {
    const div = document.createElement('div');
    div.className = 'mini-block';
    div.style.background = BLOCK_COLORS[i];
    div.style.animationDelay = (i*60) + 'ms';
    heroBlocks.appendChild(div);
  }

  // Level cards
  const grid = $('levels-grid');
  grid.innerHTML = '';
  LEVELS.forEach((lv, idx) => {
    const p = userProgress[lv.id];
    const card = document.createElement('button');
    card.className = 'level-card' + (p.unlocked ? '' : ' locked');
    card.style.setProperty('--tab', lv.tab);
    if (p.unlocked) {
      card.onclick = () => startLevel(idx);
    }
    const starsHtml = [0,1,2].map(i =>
      `<span class="star${i < p.stars ? ' lit' : ''}">★</span>`
    ).join('');
    card.innerHTML = `
      <div>
        <div class="level-num">Level ${idx + 1}${!p.unlocked ? ' 🔒' : ''}</div>
        <div class="level-title">${lv.title}</div>
        <div style="font-size:12px; color:var(--ink-soft);">${lv.sub}</div>
      </div>
      <div class="level-emoji">${lv.emoji}</div>
      <div style="display:flex; align-items:center; gap:6px; margin-top:6px;">
        <div class="level-stars">${starsHtml}</div>
        ${p.best > 0 ? `<span class="level-best">${p.best}/10</span>` : ''}
      </div>
    `;
    grid.appendChild(card);
  });
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('screen-' + id).classList.add('active');
}

// ============================================================
// QUIZ FLOW
// ============================================================
function startLevel(idx) {
  state = {
    levelIdx: idx,
    qIdx: 0,
    correct: 0,
    streak: 0,
    currentQ: null,
    answered: false
  };
  $('quiz-title').textContent = LEVELS[idx].title;
  showScreen('quiz');
  nextQuestion();
}

function updateProgressBar() {
  const pct = (state.qIdx / QUESTIONS_PER_LEVEL) * 100;
  $('progress-fill').style.width = pct + '%';
  $('progress-text').textContent = `${state.qIdx}/${QUESTIONS_PER_LEVEL}`;
  $('streak-display').textContent = `🔥 ${state.streak}`;
}

function nextQuestion() {
  if (state.qIdx >= QUESTIONS_PER_LEVEL) {
    finishLevel();
    return;
  }
  state.answered = false;
  $('feedback').textContent = '';
  $('feedback').className = 'feedback';
  $('btn-next').hidden = true;
  $('btn-skip').hidden = false;

  const level = LEVELS[state.levelIdx];
  const q = level.gen();
  state.currentQ = q;

  $('question-card').innerHTML = q.html;

  const answerArea = $('answer-area');
  if (q.type === 'input') {
    answerArea.innerHTML = `
      <div class="typed-row">
        <input type="text" inputmode="numeric" class="typed-input" id="typed-input" autocomplete="off" placeholder="?"/>
        <button class="check-btn" id="check-btn">Check</button>
      </div>
    `;
    const input = $('typed-input');
    const btn = $('check-btn');
    input.focus();
    btn.onclick = () => handleTypedAnswer(input.value);
    input.onkeydown = (e) => { if (e.key === 'Enter') handleTypedAnswer(input.value); };
  } else {
    answerArea.innerHTML = '<div class="answers" id="choices"></div>';
    const choicesEl = $('choices');
    q.choices.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.textContent = c;
      btn.onclick = () => handleChoice(btn, c);
      choicesEl.appendChild(btn);
    });
  }

  updateProgressBar();
}

function handleChoice(btn, choice) {
  if (state.answered) return;
  state.answered = true;
  const q = state.currentQ;
  const isCorrect = String(choice) === String(q.answer);

  document.querySelectorAll('.answer-btn').forEach(b => {
    if (b === btn) {
      b.classList.add(isCorrect ? 'correct' : 'wrong');
    } else if (String(b.textContent) === String(q.answer)) {
      b.classList.add('correct');
    } else {
      b.classList.add('fade');
    }
    b.disabled = true;
  });

  postAnswer(isCorrect);
}

function handleTypedAnswer(input) {
  if (state.answered) return;
  if (input.trim() === '') return;
  state.answered = true;
  const q = state.currentQ;
  const checkBtn = $('check-btn');
  const inputEl = $('typed-input');

  let isCorrect = false;
  if (q.compare) {
    isCorrect = q.compare(input);
  } else {
    // Number compare
    const inNum = parseFloat(input);
    const expectNum = parseFloat(q.answer);
    if (!isNaN(inNum) && !isNaN(expectNum)) {
      isCorrect = Math.abs(inNum - expectNum) < 0.001;
    } else {
      isCorrect = input.trim() === String(q.answer);
    }
  }

  checkBtn.classList.add(isCorrect ? 'correct' : 'wrong');
  inputEl.disabled = true;
  checkBtn.disabled = true;
  if (!isCorrect) {
    // Show correct answer beside the input
    const ans = document.createElement('div');
    ans.style.cssText = 'text-align:center; font-family:Bowlby One; margin-top:6px; color: var(--good);';
    ans.textContent = `Answer: ${q.answer}`;
    inputEl.parentElement.parentElement.appendChild(ans);
  }
  postAnswer(isCorrect);
}

function postAnswer(isCorrect) {
  const fb = $('feedback');
  if (isCorrect) {
    state.correct++;
    state.streak++;
    fb.textContent = randomPraise(state.streak);
    fb.className = 'feedback good';
    if (state.streak >= 3) burstConfetti(state.streak >= 5 ? 24 : 12);
    if (state.streak === 3 || state.streak === 5 || state.streak === 10) {
      setTimeout(() => soundSparkle(), 300);
    }
    bumpSound(true);
  } else {
    state.streak = 0;
    fb.textContent = randomEncouragement();
    fb.className = 'feedback bad';
    bumpSound(false);
  }
  state.qIdx++;
  updateProgressBar();
  $('btn-skip').hidden = true;
  $('btn-next').hidden = false;
  $('btn-next').textContent = state.qIdx >= QUESTIONS_PER_LEVEL ? 'Finish →' : 'Next →';
  $('btn-next').focus();
}

function randomPraise(streak) {
  if (streak >= 5) return choice(['🔥 On fire!', '⚡ Unstoppable!', '🏆 Amazing!', '🌟 Brilliant!']);
  if (streak >= 3) return choice(['🎉 Awesome!', '✨ Yes!', '💪 Great job!', '🚀 Nice!']);
  return choice(['✓ Correct!', '👍 Right!', 'Nice!', 'Yep!']);
}
function randomEncouragement() {
  return choice(['Not quite — keep going!', 'Almost! Try the next one.', 'Good try! Onwards!', 'No worries — next one!']);
}

// ---------- Confetti ----------
function burstConfetti(count = 16) {
  const stage = $('celebration');
  const colors = ['#E63946','#F77F00','#FCD53F','#6BCB77','#4DA8DA','#8E4FB0','#F49AC2','#14B8B0'];
  for (let i = 0; i < count; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = (Math.random() * 100) + '%';
    c.style.top = (-20 - Math.random()*30) + 'px';
    c.style.background = choice(colors);
    c.style.animationDuration = (1.5 + Math.random()*1.5) + 's';
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    if (Math.random() > 0.5) c.style.borderRadius = '50%';
    stage.appendChild(c);
    setTimeout(() => c.remove(), 3500);
  }
}

// ---------- Sound (synthesized, no assets) ----------
let audioCtx = null;
function getCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// Play a single note with envelope
function playNote(freq, startOffset, duration, type = 'triangle', volume = 0.18) {
  const ctx = getCtx();
  if (!ctx) return;
  const t = ctx.currentTime + startOffset;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  o.connect(g); g.connect(ctx.destination);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(volume, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t + duration);
  o.start(t);
  o.stop(t + duration + 0.05);
}

// Correct: cheerful ascending arpeggio
function soundCorrect(streak = 0) {
  // Major chord arpeggio C-E-G; pitch up with streak
  const base = 523.25; // C5
  const shift = Math.min(streak, 6) * 30;
  playNote(base + shift, 0, 0.12, 'triangle', 0.16);
  playNote((base + shift) * 1.26, 0.07, 0.12, 'triangle', 0.16); // E
  playNote((base + shift) * 1.5, 0.14, 0.18, 'triangle', 0.16); // G
  if (streak >= 3) {
    playNote((base + shift) * 2, 0.22, 0.2, 'triangle', 0.14); // octave up
  }
}

// Wrong: gentle low "doink", not punishing
function soundWrong() {
  playNote(220, 0, 0.15, 'sine', 0.14);
  playNote(165, 0.08, 0.2, 'sine', 0.14);
}

// Streak milestone: power-up sparkle
function soundSparkle() {
  const notes = [659.25, 783.99, 987.77, 1318.51]; // E5 G5 B5 E6
  notes.forEach((f, i) => playNote(f, i * 0.05, 0.15, 'triangle', 0.12));
}

// Level complete: little fanfare
function soundFanfare(stars) {
  // C major triad arpeggio + final chord
  const seq = [
    [523.25, 0.00], // C
    [659.25, 0.10], // E
    [783.99, 0.20], // G
    [1046.50, 0.30], // C high
  ];
  seq.forEach(([f, t]) => playNote(f, t, 0.18, 'triangle', 0.16));
  // Final chord
  if (stars >= 2) {
    [523.25, 659.25, 783.99, 1046.50].forEach(f => playNote(f, 0.5, 0.5, 'triangle', 0.10));
  }
}

// Button tap click
function soundTap() {
  playNote(800, 0, 0.04, 'square', 0.06);
}

// Wrapper kept for compatibility
function bumpSound(good) {
  if (good) soundCorrect(state.streak);
  else soundWrong();
}

// ---------- Finish ----------
function finishLevel() {
  const lv = LEVELS[state.levelIdx];
  const p = userProgress[lv.id];
  p.best = Math.max(p.best, state.correct);
  let stars = 0;
  for (let i = 0; i < STAR_THRESHOLDS.length; i++) {
    if (state.correct >= STAR_THRESHOLDS[i]) stars = i + 1;
  }
  p.stars = Math.max(p.stars, stars);
  // Unlock next
  if (stars >= 1 && state.levelIdx + 1 < LEVELS.length) {
    userProgress[LEVELS[state.levelIdx + 1].id].unlocked = true;
  }

  $('modal-title').textContent = stars >= 2 ? 'Level Complete!' : stars === 1 ? 'Nice work!' : 'Keep practicing!';
  $('modal-stars').innerHTML = [0,1,2].map(i =>
    `<span style="color:${i < stars ? 'var(--accent)' : '#d8d0c0'};">★</span>`
  ).join('');
  $('modal-msg').textContent = `You got ${state.correct} out of ${QUESTIONS_PER_LEVEL} correct.`;

  const nextBtn = $('btn-modal-next');
  const hasNext = state.levelIdx + 1 < LEVELS.length;
  nextBtn.textContent = hasNext ? 'Next Level →' : 'Done';
  nextBtn.disabled = !hasNext || stars === 0;
  nextBtn.style.opacity = nextBtn.disabled ? '0.5' : '1';

  $('modal').classList.add('show');

  soundFanfare(stars);
  if (stars >= 2) {
    burstConfetti(48);
  }
}

// ============================================================
// EVENT WIRING
// ============================================================
$('btn-home').onclick = () => {
  showScreen('home');
  renderHome();
};
$('btn-skip').onclick = () => {
  if (state.answered) return;
  state.streak = 0;
  state.qIdx++;
  // Reveal correct on the card
  const fb = $('feedback');
  fb.textContent = `Answer: ${state.currentQ.answer}`;
  fb.className = 'feedback';
  state.answered = true;
  updateProgressBar();
  $('btn-skip').hidden = true;
  $('btn-next').hidden = false;
};
$('btn-next').onclick = () => {
  nextQuestion();
};
$('btn-modal-home').onclick = () => {
  $('modal').classList.remove('show');
  showScreen('home');
  renderHome();
};
$('btn-modal-next').onclick = () => {
  $('modal').classList.remove('show');
  if (state.levelIdx + 1 < LEVELS.length) {
    startLevel(state.levelIdx + 1);
  }
};
$('btn-reset').onclick = () => {
  LEVELS.forEach((lv, i) => {
    userProgress[lv.id] = { best: 0, stars: 0, unlocked: true };
  });
  renderHome();
};

// Init
renderHome();
</script>
